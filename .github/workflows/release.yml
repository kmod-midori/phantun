name: Build and release
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    - name: Run lint
      run: cargo clippy --verbose
    - name: Build
      run: cargo build --verbose

  docker:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: phantun
          platforms: linux/amd64,linux/arm64

  build-cross:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --release --target ${{ matrix.target }}
      - name: Rename artifacts and compress
        run: |
          cd target/${{ matrix.target }}/release
          mv client phantun_client
          mv server phantun_server
          zip phantun_${{ matrix.target }}.zip phantun_client phantun_server

      - name: Save musl binaries for OpenWrt packaging
        uses: actions/upload-artifact@v4
        with:
          name: musl-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/phantun_client
            target/${{ matrix.target }}/release/phantun_server
          if-no-files-found: error

      - name: Save release archive
        uses: actions/upload-artifact@v4
        with:
          name: phantun-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename artifacts and compress
        run: |
          cd target/${{ matrix.target }}/release
          mv client phantun_client
          mv server phantun_server
          zip phantun_${{ matrix.target }}.zip phantun_client phantun_server

      - name: Save release archive
        uses: actions/upload-artifact@v4
        with:
          name: phantun-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.zip
          if-no-files-found: error

  build-mips-nightly:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      matrix:
        target:
          - mips-unknown-linux-musl
          - mips64-unknown-linux-muslabi64
          - mipsel-unknown-linux-musl

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rust-src
      - uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --release --target ${{ matrix.target }} -Z build-std
      - name: Rename artifacts and compress
        run: |
          cd target/${{ matrix.target }}/release
          mv client phantun_client
          mv server phantun_server
          zip phantun_${{ matrix.target }}_nightly.zip phantun_client phantun_server

      - name: Save musl binaries for OpenWrt packaging
        if: contains(matrix.target, 'musl')
        uses: actions/upload-artifact@v4
        with:
          name: musl-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/phantun_client
            target/${{ matrix.target }}/release/phantun_server
          if-no-files-found: error

      - name: Save release archive
        uses: actions/upload-artifact@v4
        with:
          name: phantun-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.zip
          if-no-files-found: error

  openwrt:
    needs: [build-cross, build-mips-nightly]
    uses: ./.github/workflows/openwrt.yml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, docker, build-cross, build-macos, build-mips-nightly, openwrt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phantun-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref, '-') }}
