name: OpenWrt packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s openwrt/tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64_generic
            target: aarch64-unknown-linux-musl
          - arch: arm_cortex-a15_neon-vfpv4
            target: armv7-unknown-linux-musleabihf
          - arch: mips_24kc
            target: mips-unknown-linux-musl
          - arch: mipsel_24kc
            target: mipsel-unknown-linux-musl
        release: ['24.10.7', '25.12.5']
        include:
          - release: '24.10.7'
            format: ipk
          - release: '25.12.5'
            format: apk
    steps:
      - uses: actions/checkout@v5
      - name: Download existing musl binaries
        uses: actions/download-artifact@v4
        with:
          name: musl-${{ matrix.platform.target }}
          path: openwrt/phantun/prebuilt
      - name: Stage package metadata
        run: |
          cp LICENSE-MIT LICENSE-APACHE openwrt/phantun/prebuilt/
          python3 - <<'PYTHON'
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('phantun/Cargo.toml').read_text())['package']['version']
          pathlib.Path('openwrt/phantun/prebuilt/version').write_text(version + '\n')
          PYTHON
      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v8
        env:
          ARCH: ${{ matrix.platform.arch }}-${{ matrix.release }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          PACKAGES: phantun
          NO_SHFMT_CHECK: 1
          V: s
      - name: Collect package
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
          SDK_RELEASE: ${{ matrix.release }}
        run: |
          mkdir -p dist
          find bin/packages -type f -name "phantun*.$PACKAGE_FORMAT" -exec cp -t dist {} +
          test "$(find dist -type f | wc -l)" -eq 1
          for package in dist/*; do
            mv "$package" "dist/openwrt-$SDK_RELEASE-$(basename "$package")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: phantun-openwrt-${{ matrix.release }}-${{ matrix.platform.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-openwrt-${{ matrix.release }}-${{ matrix.platform.arch }}
          path: logs/
