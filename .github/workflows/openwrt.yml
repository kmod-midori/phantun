name: OpenWrt packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64_generic
            target: aarch64-unknown-linux-musl
          - arch: arm_cortex-a15_neon-vfpv4
            target: armv7-unknown-linux-musleabihf
          - arch: mips_24kc
            target: mips-unknown-linux-musl
          - arch: mipsel_24kc
            target: mipsel-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download existing musl binaries
        uses: actions/download-artifact@v4
        with:
          name: musl-${{ matrix.platform.target }}
          path: openwrt/phantun/prebuilt
      - name: Prepare official IPK builder
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          curl -fsSL --retry 3 https://raw.githubusercontent.com/openwrt/openwrt/v24.10.7/scripts/ipkg-build -o "$RUNNER_TEMP/ipkg-build"
      - name: Package IPK and APK
        env:
          OPENWRT_ARCH: ${{ matrix.platform.arch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(git describe --tags --match 'v*.*.*' --abbrev=0)
          fi
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          bash openwrt/package.sh "$version" "$OPENWRT_ARCH" openwrt/phantun/prebuilt dist "$RUNNER_TEMP/ipkg-build"
      - uses: actions/upload-artifact@v4
        with:
          name: phantun-openwrt-${{ matrix.platform.arch }}
          path: dist/*
          if-no-files-found: error
